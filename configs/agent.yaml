agent:
  name: Sunday
  workspace_dir: .sunday/workspace
  memory_dir: .sunday/memory
  sessions_dir: .sunday/sessions
  log_dir: .sunday/logs
model:
  provider: openai
  id: deepseek-chat
  temperature: 0.2
  max_tokens: 8192
  base_url: https://api.deepseek.com/v1
  api_key_env: DEEPSEEK_API_KEY
reasoning:
  max_steps: 20
  max_react_iteration: 40
  max_replans_per_step: 10
  max_replans: 40
  thinking_level: medium
memory:
  consolidation_cron: 0 4 * * *
  log_retention_days: 30
  l0_max_lines: 100
  history_max_chars: 2000
tools:
  default_timeout: 60
  max_output_chars: 20480
  sandbox_mode: true
  allow_list: []
  deny_list:
  - rm -rf
  - dd if=
mcp:
  servers: []
skills:
  extra_dirs: []
quality:
  fact_check:
    enabled: false
    max_tool_calls: 2
    timeout_seconds: 10
    allowed_tools:
    - web_search
    - read_file
  subject_consistency:
    enabled: true
    checker: llm
  final_step_anchor:
    enabled: true
    intent_keywords:
    - 整合
    - 总结
    - 汇总
    - 最终
    - 综合
    - 清单
    - 建议
    - 报告
  realtime_hints:
    enabled: true
  offline_output_label:
    enabled: true
  tool_usage_audit:
    enabled: true
  synthesis_quality_check:
    enabled: true
tasks:
  daily_brief:
    description: 每日简报：汇总今日未读邮件摘要、当天日历事件、待处理事项
    steps:
    - 列出今天的未读邮件（最多 10 封），提取主题和发件人
    - 读取今天的日历事件
    - 生成简洁的日报摘要，包含邮件要点和日程安排
    - 将简报写入 workspace/memory/ 今日日志
