agent:
  name: Sunday
  workspace_dir: .sunday/workspace
  memory_dir: .sunday/memory
  sessions_dir: .sunday/sessions
  log_dir: .sunday/logs
model:
  provider: openai
  id: deepseek-v4-pro
  temperature: 0.2
  # DeepSeek-V4 Pro thinking 模式下 reasoning_content + content 共用 max_tokens；
  # 8192 装不下完整中文长报告 → tool_call JSON 截断。16384 覆盖大部分长文场景。
  max_tokens: 16384
  base_url: https://api.deepseek.com/v1
  api_key_env: DEEPSEEK_API_KEY
reasoning:
  # 顶层 step 数上限：Planner 一次产出超过则截断（react_agent.py 处理）
  max_steps: 10
  # Team 内 sub-step 数上限：Team 子规划超过则截断（team.py 处理）
  max_steps_per_step: 3
  # 单 sub-step 内 ReAct 工具调用轮次上限：>15 会显著膨胀上下文
  max_react_iterations_per_substep: 15
  # Team 内 sub-plan 重规划上限：每次都跑完整 ReAct（~30 调用），3 次足以处理偶发失败
  max_replans_per_step: 3
  # 全局外层重规划总上限：跨所有 top-level step 累加，10 次合理
  max_replans: 3
  thinking_level: medium
memory:
  consolidation_cron: 0 4 * * *
  log_retention_days: 30
  l0_max_lines: 100
  history_max_chars: 2000
tools:
  default_timeout: 60
  # 单次工具结果上限：每轮 ReAct 都会附加到消息历史。20480 在 10 轮后 → ~200k 字符上下文，
  # DeepSeek 处理 100k+ 上下文显著变慢。8000 在保留可用性的同时控制膨胀。
  max_output_chars: 8000
  sandbox_mode: true
  allow_list: []
  deny_list:
  - rm -rf
  - dd if=
mcp:
  servers: []
skills:
  extra_dirs: []
quality:
  fact_check:
    enabled: false
    max_tool_calls: 2
    timeout_seconds: 10
    allowed_tools:
    - web_search
    - read_file
  subject_consistency:
    enabled: true
    checker: llm
  final_step_anchor:
    enabled: true
    intent_keywords:
    - 整合
    - 总结
    - 汇总
    - 最终
    - 综合
    - 清单
    - 建议
    - 报告
  realtime_hints:
    enabled: true
  offline_output_label:
    enabled: true
  tool_usage_audit:
    enabled: true
  synthesis_quality_check:
    enabled: true
tui:
  # 超过 N 行的粘贴折叠为 [Pasted N lines #xxxxxx] 占位符；提交时还原
  paste_fold_threshold: 4
  # 输入历史最大条数（per-session，从已有 turns 派生）
  input_history_size: 200
  # 是否启用 Textual 鼠标捕获。默认 false：让终端原生处理选区/右键。
  # 需要拖拽选中文字、右键粘贴时保持 false；若某终端 mouse=false 异常可改 true
  enable_mouse: false
tasks:
  daily_brief:
    description: 每日简报：汇总今日未读邮件摘要、当天日历事件、待处理事项
    steps:
    - 列出今天的未读邮件（最多 10 封），提取主题和发件人
    - 读取今天的日历事件
    - 生成简洁的日报摘要，包含邮件要点和日程安排
    - 将简报写入 workspace/memory/ 今日日志
