agent:
  name: Sunday
  workspace_dir: .sunday/workspace
  memory_dir: .sunday/memory
  sessions_dir: .sunday/sessions
  log_dir: .sunday/logs
model:
  provider: openai
  id: deepseek-chat
  temperature: 0.2
  max_tokens: 16384
  base_url: https://api.deepseek.com/v1
  api_key_env: DEEPSEEK_API_KEY
reasoning:
  max_replans: 3
  max_steps: 10
  max_replans_per_step: 2
  max_steps_per_step: 10
  max_react_iterations_per_substep: 20
  thinking_level: medium
memory:
  consolidation_cron: 0 4 * * *
  log_retention_days: 30
  l0_max_lines: 100
  history_max_chars: 2000
tools:
  default_timeout: 60
  max_output_chars: 8000
  sandbox_mode: true
  allow_list: []
  deny_list:
  - rm -rf
  - dd if=
mcp:
  servers:
    # Tavily —— 面向 LLM 的联网搜索，返回结构化摘要；驱动 research/synthesis 的实时数据需求
    - name: tavily
      command: npx
      args:
        - -y
        - tavily-mcp@latest
      # ${VAR} 由 Phase 5 MCPClientManager 从 os.environ 展开（.env 已注入 TAVILY_API_KEY）
      env:
        TAVILY_API_KEY: ${TAVILY_API_KEY}
      enabled: true
    # Fetch —— 抓取任意 URL 正文并转 markdown；与 tavily 组成"搜索 → 取正文"两段式
    - name: fetch
      command: uvx
      args:
        - mcp-server-fetch
      enabled: true
skills:
  extra_dirs: []
quality:
  fact_check:
    enabled: false
    max_tool_calls: 2
    timeout_seconds: 10
    allowed_tools:
    - web_search
    - read_file
  subject_consistency:
    enabled: true
    checker: llm
  final_step_anchor:
    enabled: true
    intent_keywords:
    - 整合
    - 总结
    - 汇总
    - 最终
    - 综合
    - 清单
    - 建议
    - 报告
  realtime_hints:
    enabled: true
  offline_output_label:
    enabled: true
  tool_usage_audit:
    enabled: true
  synthesis_quality_check:
    enabled: true
tui:
  paste_fold_threshold: 4
  input_history_size: 200
tasks:
  daily_brief:
    description: 每日简报：汇总今日未读邮件摘要、当天日历事件、待处理事项
    steps:
    - 列出今天的未读邮件（最多 10 封），提取主题和发件人
    - 读取今天的日历事件
    - 生成简洁的日报摘要，包含邮件要点和日程安排
    - 将简报写入 workspace/memory/ 今日日志
